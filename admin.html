  <script>

    // ZERO TRUST 2-STEP AUTH CONFIGURATION
    // ========================================================
    const MASTER_HASH = '2451eafa3bfdda3304a11ef509d6203308d249972b3d93e6ef9a4d0559d9bfab'; // dev@0987
    const CHALLENGE_HASH = '043a718774c572bd8a25adbeb1bfcd5c0256ae11cecf9f9c3f925d0e52beaf89'; // 's'

    const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('devault_portfolio_sync') : null;

    let isAuthenticated = sessionStorage.getItem('devault_admin_auth') === 'true';
    let authStep = 1;

    // ========================================================
    // PROGRESSIVE LOCKOUT SYSTEM
    // ========================================================
    // Tiers (every 5 consecutive failures):
    //   5 → 1 min | 10 → 2 min | 15 → 5 min | 20 → 10 min | 25 → 20 min | 30 → 40 min | ...
    const LOCKOUT_TIERS = [60000, 120000, 300000, 600000, 1200000]; // ms per tier (keeps doubling after last)

    function getLockDuration(tier) {
      // tier is 1-based (1st block = after 5 fails, 2nd = after 10, ...)
      if (tier <= LOCKOUT_TIERS.length) return LOCKOUT_TIERS[tier - 1];
      // After defined tiers, keep doubling from last
      let d = LOCKOUT_TIERS[LOCKOUT_TIERS.length - 1];
      for (let i = LOCKOUT_TIERS.length; i < tier; i++) d *= 2;
      return d;
    }

    function getFailCount() {
      return parseInt(localStorage.getItem('devault_fail_count') || '0', 10);
    }

    function getLockUntil() {
      return parseInt(localStorage.getItem('devault_lock_until') || '0', 10);
    }

    function isLocked() {
      return Date.now() < getLockUntil();
    }

    function recordFailure() {
      let count = getFailCount() + 1;
      localStorage.setItem('devault_fail_count', count);
      if (count % 5 === 0) {
        const tier = count / 5;
        const duration = getLockDuration(tier);
        localStorage.setItem('devault_lock_until', Date.now() + duration);
      }
    }

    function resetFailures() {
      localStorage.removeItem('devault_fail_count');
      localStorage.removeItem('devault_lock_until');
    }

    let _lockCountdownTimer = null;

    function formatDuration(ms) {
      const s = Math.ceil(ms / 1000);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return rem > 0 ? m + 'm ' + rem + 's' : m + 'm';
    }

    async function sha256(plaintext) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(plaintext));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const DEFAULT_BIO = {

      try {

        if (storedBio) currentBio = { ...DEFAULT_BIO, ...JSON.parse(storedBio) };
      } catch (e) {
        currentBio = { ...DEFAULT_BIO };
      }
    }

    function renderLockout() {
      const app = document.getElementById('app');
      if (_lockCountdownTimer) clearInterval(_lockCountdownTimer);

      function drawLockout() {
        const remaining = getLockUntil() - Date.now();
        if (remaining <= 0) {
          if (_lockCountdownTimer) clearInterval(_lockCountdownTimer);
          _lockCountdownTimer = null;
          render();
          return;
        }
        const failCount = getFailCount();
        app.innerHTML = `

                <p class="text-[10px] font-mono text-rose-400 uppercase tracking-widest">Time remaining until unlock</p>
                <div id="lockCountdown" class="text-5xl font-display font-bold text-white tabular-nums">${formatDuration(remaining)}</div>
                <div class="w-full h-1 rounded-full bg-neutral-800 overflow-hidden">
                  <div class="h-full bg-rose-500 rounded-full transition-all duration-1000" style="width:${Math.min(100, (remaining / getLockDuration(Math.ceil(failCount/5))) * 100).toFixed(1)}%"></div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3 text-xs font-mono">
                <div class="p-3 rounded-xl bg-neutral-900 border border-white/5">

                  <div class="text-neutral-500 text-[10px] uppercase tracking-widest mb-1">Lockout Tier</div>
                  <div class="text-rose-400 font-bold text-lg">${Math.ceil(failCount/5)}</div>
                </div>
              </div>

              <p class="text-[10px] font-mono text-neutral-600">DEVAULT // ZERO TRUST SECURITY SYSTEM</p>
            </div>
          </div>
        `;
      }

      drawLockout();
      _lockCountdownTimer = setInterval(drawLockout, 1000);
    }

    function render() {
      const app = document.getElementById('app');

      // --- Lockout Gate ---
      if (!isAuthenticated && isLocked()) {
        renderLockout();
        return;
      }

      // Login Gate
      if (!isAuthenticated) {
        const failCount = getFailCount();
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-6 animate-fadeIn">
            <div class="w-full max-w-md p-8 rounded-3xl bg-neutral-950/90 backdrop-blur-xl border border-white/10 cyber-glow text-center space-y-6">
              
              <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-white/10 mx-auto flex items-center justify-center">

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>

              <div class="space-y-1">
                <span class="px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-[10px] font-mono text-sky-400 uppercase tracking-widest">

                </span>
                <h1 class="text-2xl font-display font-bold text-white tracking-tight">Root Management CMS</h1>
                <p class="text-xs font-mono text-neutral-400">Total Portfolio Customization Engine</p>
              </div>

              <!-- Step indicator -->
              <div class="flex items-center justify-center gap-2 text-[11px] font-mono text-neutral-400">
                <span class="px-2 py-0.5 rounded ${authStep === 1 ? 'bg-sky-500/20 text-sky-400 font-bold border border-sky-500/30' : 'bg-neutral-900'}">STEP 1: PASSWORD</span>
                <span>&rarr;</span>
                <span class="px-2 py-0.5 rounded ${authStep === 2 ? 'bg-sky-500/20 text-sky-400 font-bold border border-sky-500/30' : 'bg-neutral-900'}">STEP 2: 2FA</span>
              </div>

              ${failCount > 0 ? `
              <div class="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[10px] font-mono">
                WARNING: ${failCount} failed attempt${failCount > 1 ? 's' : ''} recorded.
                ${5 - (failCount % 5) === 5 ? '' : (5 - (failCount % 5)) + ' attempt' + (5 - (failCount % 5) > 1 ? 's' : '') + ' until next lockout.'}
              </div>` : ''}

              <form id="loginForm" class="space-y-4">
                ${authStep === 1 ? `
                  <input 
                    type="password" 
                    id="pwdInput" 
                    autofocus
                    required
                    placeholder="Enter Master Password..."
                    class="w-full px-4 py-3.5 rounded-xl bg-neutral-900 border border-white/10 text-white placeholder-neutral-600 focus:outline-none focus:border-sky-400 text-sm font-mono tracking-widest text-center"
                  />
                  <button 
                    type="submit" 
                    class="w-full py-3.5 rounded-xl bg-sky-400 hover:bg-white text-black font-display font-bold text-xs tracking-wider transition-all duration-300 shadow-md cursor-pointer"
                  >
                    CONTINUE &rarr;
                  </button>
                ` : `
                  <div class="p-3.5 rounded-xl bg-neutral-900/80 border border-sky-500/30 text-sky-400 text-xs font-mono">
                    CHALLENGE: Who is your MJ?
                  </div>
                  <input 
                    type="text" 
                    id="answerInput" 
                    autofocus
                    required
                    placeholder="Enter Secret Key..."
                    class="w-full px-4 py-3.5 rounded-xl bg-neutral-900 border border-white/10 text-white placeholder-neutral-600 focus:outline-none focus:border-sky-400 text-sm font-mono tracking-widest text-center uppercase"
                  />
                  <div class="flex gap-2">
                    <button 
                      type="button"
                      id="backBtn"
                      class="flex-1 py-3.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-neutral-300 font-display font-bold text-xs tracking-wider transition-all"
                    >
                      Back
                    </button>
                    <button 
                      type="submit" 
                      class="flex-[2] py-3.5 rounded-xl bg-sky-400 hover:bg-white text-black font-display font-bold text-xs tracking-wider transition-all shadow-md cursor-pointer"
                    >
                      VERIFY &amp; ENTER
                    </button>
                  </div>
                `}
                <div id="errorBox" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-mono"></div>
              </form>

              <div class="pt-4 border-t border-white/5 flex items-center justify-between text-[10px] font-mono text-neutral-500">
                <span>SECURITY: ZERO-KNOWLEDGE SHA-256</span>
                <a href="index.html" class="text-neutral-400 hover:text-white">&larr; Return to Portfolio</a>
              </div>
            </div>
          </div>
        `;

        document.getElementById('loginForm').onsubmit = async (e) => {
          e.preventDefault();
          const err = document.getElementById('errorBox');

          if (authStep === 1) {
            const pwd = document.getElementById('pwdInput').value;
            const h = await sha256(pwd);
            if (h === MASTER_HASH) {
              authStep = 2;
              render();
            } else {
              recordFailure();
              if (isLocked()) { renderLockout(); return; }
              err.classList.remove('hidden');
              const fc = getFailCount();
              const remaining5 = 5 - (fc % 5);
              err.innerText = 'ACCESS DENIED: Master password incorrect.' +
                (remaining5 < 5 ? ' (' + remaining5 + ' attempt' + (remaining5 > 1 ? 's' : '') + ' until lockout)' : '');
            }
          } else {
            const ans = document.getElementById('answerInput').value.trim().toLowerCase();
            const h = await sha256(ans);
            if (h === CHALLENGE_HASH) {
              resetFailures();
              isAuthenticated = true;
              sessionStorage.setItem('devault_admin_auth', 'true');
              loadState();
              render();
            } else {
              recordFailure();
              if (isLocked()) { renderLockout(); return; }
              err.classList.remove('hidden');
              const fc = getFailCount();
              const remaining5 = 5 - (fc % 5);
              err.innerText = 'ACCESS DENIED: Challenge verification failed.' +
                (remaining5 < 5 ? ' (' + remaining5 + ' attempt' + (remaining5 > 1 ? 's' : '') + ' until lockout)' : '');
            }
          }
        };

        if (document.getElementById('backBtn')) {
          document.getElementById('backBtn').onclick = () => {
            authStep = 1;
            render();
          };
        }
        return;
      }

      // Authenticated Dashboard
      loadState();

      app.innerHTML = `

          const idx = parseInt(slotKey.split('__')[1]);
          let proofItems;
          try { proofItems = JSON.parse(localStorage.getItem('devault_custom_proof') || 'null') || [...BUILTIN_PROOF]; }
          catch(e) { proofItems = [...BUILTIN_PROOF]; }
          if (proofItems[idx]) {
            proofItems[idx] = { ...proofItems[idx], image: dataUrl };

            if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', proof: proofItems });
          }

          const idx = parseInt(slotKey.split('__')[1]);
          let items;
          try { items = JSON.parse(localStorage.getItem('devault_custom_projects') || '[]'); }
          catch(e) { items = []; }
          if (items[idx]) {

            if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', projects: items });
          }

        } else if (slotKey.startsWith('cert__')) {
          const idx = parseInt(slotKey.split('__')[1]);
          let items;
          try { items = JSON.parse(localStorage.getItem('devault_custom_certs') || '[]'); }
          catch(e) { items = []; }
          if (items[idx]) {

            if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', certs: items });

    // ========================================================
    // 3D THREE.JS AMBIENT BACKGROUND ANIMATION
    // ========================================================
    (function init3DAmbient() {
      const container = document.getElementById('three-canvas-bg');
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 6;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
      } catch (e) {
        return;
      }

      // Torus Knot ambient wireframe geometry
      const geom = new THREE.TorusKnotGeometry(1.5, 0.45, 90, 16);
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        wireframe: true,
        transparent: true,
        opacity: 0.18
      });
      const torusMesh = new THREE.Mesh(geom, wireMat);
      scene.add(torusMesh);

      // Cyber Particles Dust
      const partGeo = new THREE.BufferGeometry();
      const count = 100;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 14;
        pos[i+1] = (Math.random() - 0.5) * 14;
        pos[i+2] = (Math.random() - 0.5) * 8;
      }
      partGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const partMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.04, transparent: true, opacity: 0.4 });
      const particles = new THREE.Points(partGeo, partMat);
      scene.add(particles);

      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', e => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        torusMesh.rotation.x = t * 0.15 + mouseY * 0.15;
        torusMesh.rotation.y = t * 0.25 + mouseX * 0.15;
        particles.rotation.y = t * 0.04;
        renderer.render(scene, camera);
      }
      animate();
    })();

    // Initial render
    loadState();
    render();
  </script>
</body>
</html>
