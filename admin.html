<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVAULT // Root Management Engine & CMS (SAQR® Edition)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2305070a'/><path d='M25 25 L45 25 L50 48 L42 58 Z' fill='%23ffffff'/><path d='M75 25 L55 25 L42 58 L50 68 Z' fill='%2338bdf8'/><path d='M45 60 L55 60 L55 75 L45 75 Z' fill='%23ffffff'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      background-color: #030508;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Chakra Petch', sans-serif; }
    .cyber-glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.15); }
    .cyber-glow-danger { box-shadow: 0 0 25px rgba(244, 63, 94, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-sky-500 selection:text-black">

  <div class="fixed inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px]"></div>
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-sky-500/10 blur-[130px] pointer-events-none"></div>

  <div id="app" class="relative z-10 flex-1 flex flex-col"></div>

  <script>
    // ========================================================
    // SAQR® ANTI-BRUTE FORCE & ZERO-PLAINTEXT ENGINE v3.2
    // ========================================================
    const SAQR_SALT = 'devault-yahia-elsemary-defense-salt-v1';
    // Pre-calculated PBKDF2-SHA256 (100,000 iters) of: "dev@0987"
    const MASTER_HASH = '064a8c6469df1022b44062dffe2c6a1d39efb5e21ce677314fa86a266e75ecab';

    const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('devault_portfolio_sync') : null;

    let failedAttempts = parseInt(localStorage.getItem('saqr_failed_attempts') || '0', 10);
    let lockUntil = parseInt(localStorage.getItem('saqr_lock_until') || '0', 10);
    let isAuthenticated = sessionStorage.getItem('devault_admin_auth') === 'true';

    async function hashKey(plaintext) {
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(plaintext), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        salt: enc.encode(SAQR_SALT),
        iterations: 100000,
        hash: 'SHA-256'
      }, keyMat, 256);
      return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Default Bio State
    const DEFAULT_BIO = {
      name: 'YAHIA ELSEMARY',
      badge: 'AASTMT • CYBER & CREATIVE ENGINEERING',
      headline: "I BUILD WHAT'S NEXT.",
      subheadline: 'Creative Developer exploring the intersection of design, engineering, and technology.',
      tagline: 'DEVAULT // CREATIVE DEV',
      aboutText: 'Computer engineering undergraduate at the Arab Academy for Science, Technology and Maritime Transport (AASTMT, 2025–Present). Specialized in offensive cybersecurity, WebAR graphics shaders, full-stack architecture, and autonomous AI agents.',
      statusText: 'Available for high-impact engineering & security collaborations',
      linkedinUrl: 'https://www.linkedin.com/in/yahia-elsemary-a11930399/',
      githubUrl: 'https://github.com/BlackstarII',
      email: 'yaworke@gmail.com',
    };

    let activeTab = 'bio'; // 'bio' | 'inbox' | 'broadcast' | 'telemetry'
    let messages = [];
    let currentBio = { ...DEFAULT_BIO };

    function loadState() {
      try {
        messages = JSON.parse(localStorage.getItem('devault-secure-inbox') || '[]');
      } catch (e) {
        messages = [];
      }
      try {
        const storedBio = localStorage.getItem('devault_custom_bio');
        if (storedBio) currentBio = { ...DEFAULT_BIO, ...JSON.parse(storedBio) };
      } catch (e) {
        currentBio = { ...DEFAULT_BIO };
      }
    }

    function render() {
      const app = document.getElementById('app');
      const now = Date.now();

      // Lockdown Check
      if (now < lockUntil) {
        const rem = Math.ceil((lockUntil - now) / 1000);
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-md p-8 rounded-3xl bg-neutral-950 border border-rose-500/30 cyber-glow-danger text-center space-y-5">
              <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 mx-auto flex items-center justify-center text-rose-400 font-bold text-2xl font-mono">!</div>
              <h2 class="text-2xl font-display font-bold text-rose-400">SAQR® LOCKDOWN ACTIVE</h2>
              <p class="text-xs font-mono text-neutral-400">Repeated authentication failures detected. Terminal locked for security.</p>
              <div class="p-4 rounded-xl bg-neutral-900 border border-rose-500/20 text-xs font-mono text-rose-300">
                UNLOCK IN: <span class="text-white font-bold text-base">${rem}s</span>
              </div>
            </div>
          </div>
        `;
        setTimeout(render, 1000);
        return;
      }

      // Login Gate
      if (!isAuthenticated) {
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-md p-8 rounded-3xl bg-neutral-950 border border-white/10 cyber-glow text-center space-y-6">
              <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-white/10 mx-auto flex items-center justify-center">
                <svg class="w-8 h-8 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <div class="space-y-1">
                <span class="px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-[10px] font-mono text-sky-400 uppercase tracking-widest">
                  DEVAULT // SAQR® ENGINE v3.2
                </span>
                <h1 class="text-2xl font-display font-bold text-white tracking-tight">Root Management CMS</h1>
                <p class="text-xs font-mono text-neutral-400">Control Public Portfolio Content & Inspect Inbox</p>
              </div>

              <form id="loginForm" class="space-y-4">
                <input 
                  type="password" 
                  id="pwdInput" 
                  autofocus
                  required
                  placeholder="Enter Master Passphrase..."
                  class="w-full px-4 py-3.5 rounded-xl bg-neutral-900 border border-white/10 text-white placeholder-neutral-600 focus:outline-none focus:border-sky-400 text-sm font-mono tracking-widest text-center"
                />
                <div id="errorBox" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-mono"></div>
                <button 
                  type="submit" 
                  id="submitBtn"
                  class="w-full py-3.5 rounded-xl bg-sky-400 hover:bg-white text-black font-display font-bold text-xs tracking-wider transition-all duration-300 shadow-md cursor-pointer"
                >
                  AUTHENTICATE ROOT
                </button>
              </form>

              <div class="pt-4 border-t border-white/5 flex items-center justify-between text-[10px] font-mono text-neutral-500">
                <span>SECURITY: PBKDF2-SHA256</span>
                <span>ATTEMPTS: ${failedAttempts}/5</span>
              </div>
            </div>
          </div>
        `;

        document.getElementById('loginForm').onsubmit = async (e) => {
          e.preventDefault();
          const pwd = document.getElementById('pwdInput').value;
          const btn = document.getElementById('submitBtn');
          const err = document.getElementById('errorBox');
          btn.disabled = true;
          btn.innerText = 'VERIFYING WITH PBKDF2...';

          const hash = await hashKey(pwd);
          if (hash === MASTER_HASH) {
            isAuthenticated = true;
            sessionStorage.setItem('devault_admin_auth', 'true');
            localStorage.removeItem('saqr_failed_attempts');
            localStorage.removeItem('saqr_lock_until');
            failedAttempts = 0;
            loadState();
            render();
          } else {
            failedAttempts++;
            localStorage.setItem('saqr_failed_attempts', failedAttempts.toString());
            btn.disabled = false;
            btn.innerText = 'AUTHENTICATE ROOT';
            if (failedAttempts >= 5) {
              lockUntil = Date.now() + 60000;
              localStorage.setItem('saqr_lock_until', lockUntil.toString());
              render();
            } else {
              err.classList.remove('hidden');
              err.innerText = `ACCESS DENIED: Invalid passphrase. (${5 - failedAttempts} attempts remaining)`;
            }
          }
        };
        return;
      }

      // Authenticated Dashboard
      loadState();

      app.innerHTML = `
        <header class="px-6 py-4 bg-neutral-950 border-b border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-black border border-white/20 flex items-center justify-center p-1.5 shadow-md">
              <svg viewBox="0 0 100 100" class="w-full h-full" fill="none">
                <path d="M22 22 L38 22 L50 48 L42 58 Z" fill="#ffffff" />
                <path d="M78 22 L62 22 L42 58 L50 68 Z" fill="#f1f5f9" />
                <path d="M44 60 L56 60 L56 78 L44 78 Z" fill="#ffffff" />
                <polygon points="50,46 55,53 50,60 45,53" fill="#38bdf8" />
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-display font-bold text-white tracking-wide">YAHIA ELSEMARY</span>
                <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">ROOT CMS ACTIVE</span>
              </div>
              <p class="text-[10px] font-mono text-neutral-500">DEVAULT Standalone CMS & Management Engine</p>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-neutral-900 border border-white/10 text-xs font-mono text-neutral-300 hover:text-white flex items-center gap-1.5 transition-colors">
              <span>View Public Portfolio</span>
              <svg class="w-3.5 h-3.5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
            <button id="logoutBtn" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-300 text-xs font-mono transition-colors">
              Lock Session
            </button>
          </div>
        </header>

        <div class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
          
          <!-- Navigation Tabs -->
          <div class="flex items-center justify-between border-b border-white/10 pb-4 flex-wrap gap-4">
            <div class="flex items-center gap-2">
              <button id="tabBio" class="px-4 py-2 rounded-xl text-xs font-mono transition-all flex items-center gap-2 ${activeTab === 'bio' ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30' : 'text-neutral-400 hover:text-white'}">
                <span>📝 Edit Portfolio Bio & Info</span>
              </button>

              <button id="tabInbox" class="px-4 py-2 rounded-xl text-xs font-mono transition-all flex items-center gap-2 ${activeTab === 'inbox' ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30' : 'text-neutral-400 hover:text-white'}">
                <span>📬 Incoming Messages</span>
                <span class="px-2 py-0.5 rounded-full bg-neutral-900 text-[10px] text-white font-bold">${messages.length}</span>
              </button>

              <button id="tabBroadcast" class="px-4 py-2 rounded-xl text-xs font-mono transition-all flex items-center gap-2 ${activeTab === 'broadcast' ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30' : 'text-neutral-400 hover:text-white'}">
                <span>📡 Live Broadcast Notice</span>
              </button>

              <button id="tabTelemetry" class="px-4 py-2 rounded-xl text-xs font-mono transition-all flex items-center gap-2 ${activeTab === 'telemetry' ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30' : 'text-neutral-400 hover:text-white'}">
                <span>🛡️ Security Telemetry</span>
              </button>
            </div>
          </div>

          <!-- TAB 1: BIO & INFO CMS -->
          ${activeTab === 'bio' ? `
            <div class="p-6 sm:p-8 rounded-2xl bg-neutral-950 border border-white/10 space-y-6">
              <div class="flex items-center justify-between border-b border-white/5 pb-4">
                <div>
                  <h3 class="text-base font-display font-bold text-white">Live Portfolio Information Editor</h3>
                  <p class="text-xs font-mono text-neutral-400">Any changes saved here sync automatically with index.html in real time.</p>
                </div>
                <button id="resetBioBtn" class="px-3 py-1.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 text-xs font-mono text-neutral-400 hover:text-white transition-colors">
                  Reset to Defaults
                </button>
              </div>

              <form id="bioForm" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">Display Name</label>
                    <input type="text" id="bioName" value="${currentBio.name}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">Status Badge / University</label>
                    <input type="text" id="bioBadge" value="${currentBio.badge}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">Hero Primary Headline</label>
                    <input type="text" id="bioHeadline" value="${currentBio.headline}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">Tagline</label>
                    <input type="text" id="bioTagline" value="${currentBio.tagline}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                </div>

                <div>
                  <label class="text-xs font-mono text-neutral-400 block mb-1">Subheadline / Intro Pitch</label>
                  <textarea id="bioSubheadline" rows="2" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none">${currentBio.subheadline}</textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">Email Address</label>
                    <input type="email" id="bioEmail" value="${currentBio.email}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">LinkedIn Profile URL</label>
                    <input type="text" id="bioLinkedin" value="${currentBio.linkedinUrl}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                  <div>
                    <label class="text-xs font-mono text-neutral-400 block mb-1">GitHub Profile URL</label>
                    <input type="text" id="bioGithub" value="${currentBio.githubUrl}" class="w-full px-4 py-2.5 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                  </div>
                </div>

                <div class="pt-4 border-t border-white/5 flex items-center justify-between">
                  <span id="saveStatus" class="text-xs font-mono text-emerald-400"></span>
                  <button type="submit" class="px-6 py-3 rounded-xl bg-sky-400 hover:bg-white text-black font-display font-bold text-xs tracking-wider transition-colors shadow-lg cursor-pointer">
                    SAVE & SYNC TO PUBLIC PORTFOLIO
                  </button>
                </div>
              </form>
            </div>
          ` : ''}

          <!-- TAB 2: INBOX -->
          ${activeTab === 'inbox' ? `
            <div class="space-y-4">
              <div class="flex items-center justify-between px-1">
                <span class="text-xs font-mono text-neutral-400">Total Transmissions: ${messages.length}</span>
                <div class="flex items-center gap-2">
                  <button id="exportBtn" class="px-3 py-1.5 rounded-lg bg-neutral-900 border border-white/10 text-xs font-mono text-neutral-300 hover:text-white">Export JSON</button>
                  ${messages.length > 0 ? `<button id="clearBtn" class="px-3 py-1.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-mono">Clear All</button>` : ''}
                </div>
              </div>

              ${messages.length === 0 ? `
                <div class="py-20 text-center space-y-3 bg-neutral-950 rounded-2xl border border-white/5">
                  <div class="w-12 h-12 rounded-full bg-neutral-900 border border-white/10 mx-auto flex items-center justify-center text-neutral-500">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  </div>
                  <h3 class="text-sm font-display font-bold text-white">No Transmissions Logged Yet</h3>
                  <p class="text-xs font-mono text-neutral-500 max-w-sm mx-auto">When someone submits your contact form, you will see their message and device info right here.</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 gap-4">
                  ${messages.map(msg => `
                    <div class="p-6 rounded-2xl bg-neutral-950 border border-white/10 space-y-4 hover:border-white/20 transition-all">
                      <div class="flex items-start justify-between gap-4 flex-wrap">
                        <div class="flex items-center gap-3">
                          <div class="w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold font-mono">
                            ${(msg.name || 'AN').slice(0, 2).toUpperCase()}
                          </div>
                          <div>
                            <div class="flex items-center gap-2">
                              <h4 class="text-base font-display font-bold text-white">${msg.name || 'Anonymous'}</h4>
                              <span class="text-xs font-mono text-sky-400">${msg.email}</span>
                            </div>
                            <div class="flex items-center gap-2 text-[10px] font-mono text-neutral-400 mt-0.5">
                              <span>⏰ ${msg.timestamp}</span>
                              <span>•</span>
                              <span>🌐 ${msg.language}</span>
                            </div>
                          </div>
                        </div>

                        <div class="flex items-center gap-2">
                          <a href="mailto:${msg.email}?subject=Reply from Yahia Elsemary" class="px-3 py-1.5 rounded-lg bg-sky-400 hover:bg-white text-black font-mono font-bold text-xs transition-colors">Reply Email</a>
                          <button onclick="deleteMsg('${msg.id}')" class="p-1.5 rounded-lg hover:bg-rose-500/15 text-neutral-400 hover:text-rose-400 transition-colors">Delete</button>
                        </div>
                      </div>

                      <div class="p-4 rounded-xl bg-neutral-900 border border-white/5 text-xs text-neutral-200 font-sans leading-relaxed whitespace-pre-wrap">
                        ${msg.message}
                      </div>

                      <div class="pt-2 border-t border-white/5 flex items-center justify-between text-[10px] font-mono text-neutral-500">
                        <span class="truncate max-w-md">Client Agent: ${msg.userAgent || 'Standard Browser'}</span>
                        <span>Screen: ${msg.screenRes || 'Desktop'}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          ` : ''}

          <!-- TAB 3: BROADCAST -->
          ${activeTab === 'broadcast' ? `
            <div class="p-6 rounded-2xl bg-neutral-950 border border-white/10 space-y-6">
              <div class="space-y-1">
                <h3 class="text-base font-display font-bold text-white">Broadcast Public Notice Banner</h3>
                <p class="text-xs font-mono text-neutral-400">Push a live top banner notification to your public portfolio instantaneously.</p>
              </div>

              <div class="space-y-4">
                <div>
                  <label class="text-xs font-mono text-neutral-400 block mb-1.5">Announcement Text</label>
                  <input type="text" id="broadcastInput" value="${localStorage.getItem('devault_public_notice') || ''}" placeholder="e.g., Available for full-time engineering & security roles • 2026" class="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-white/10 text-white text-xs sm:text-sm font-mono focus:border-sky-400 outline-none" />
                </div>
                <div class="flex items-center gap-3">
                  <button id="saveBroadcastBtn" class="px-5 py-2.5 rounded-xl bg-sky-400 hover:bg-white text-black font-display font-bold text-xs transition-colors">PUSH LIVE TO PORTFOLIO</button>
                  <button id="clearBroadcastBtn" class="px-4 py-2.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-neutral-400 text-xs font-mono transition-colors">Disable Banner</button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- TAB 4: TELEMETRY -->
          ${activeTab === 'telemetry' ? `
            <div class="p-6 rounded-2xl bg-neutral-950 border border-white/10 space-y-6">
              <h3 class="text-base font-display font-bold text-white">Security & Zero-Trust Protocol</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="p-5 rounded-2xl bg-neutral-900 border border-white/10 space-y-1">
                  <span class="text-[10px] font-mono text-neutral-500 uppercase">Total Messages</span>
                  <div class="text-3xl font-display font-bold text-white">${messages.length}</div>
                  <span class="text-[10px] font-mono text-emerald-400">● 100% Client-Side Private</span>
                </div>
                <div class="p-5 rounded-2xl bg-neutral-900 border border-white/10 space-y-1">
                  <span class="text-[10px] font-mono text-neutral-500 uppercase">Protection Level</span>
                  <div class="text-base font-display font-bold text-sky-400">SAQR® Engine v3.2</div>
                  <span class="text-[10px] font-mono text-neutral-400">PBKDF2-SHA256 • 100,000 Iters</span>
                </div>
                <div class="p-5 rounded-2xl bg-neutral-900 border border-white/10 space-y-1">
                  <span class="text-[10px] font-mono text-neutral-500 uppercase">State Machine</span>
                  <div class="text-base font-display font-bold text-white">Bidirectional Sync</div>
                  <span class="text-[10px] font-mono text-neutral-400">Direct BroadcastChannel pipeline</span>
                </div>
              </div>
            </div>
          ` : ''}

        </div>
      `;

      // Event handlers
      document.getElementById('logoutBtn').onclick = () => {
        isAuthenticated = false;
        sessionStorage.removeItem('devault_admin_auth');
        render();
      };

      document.getElementById('tabBio').onclick = () => { activeTab = 'bio'; render(); };
      document.getElementById('tabInbox').onclick = () => { activeTab = 'inbox'; render(); };
      document.getElementById('tabBroadcast').onclick = () => { activeTab = 'broadcast'; render(); };
      document.getElementById('tabTelemetry').onclick = () => { activeTab = 'telemetry'; render(); };

      if (activeTab === 'bio') {
        document.getElementById('bioForm').onsubmit = (e) => {
          e.preventDefault();
          const updated = {
            name: document.getElementById('bioName').value.trim(),
            badge: document.getElementById('bioBadge').value.trim(),
            headline: document.getElementById('bioHeadline').value.trim(),
            subheadline: document.getElementById('bioSubheadline').value.trim(),
            tagline: document.getElementById('bioTagline').value.trim(),
            email: document.getElementById('bioEmail').value.trim(),
            linkedinUrl: document.getElementById('bioLinkedin').value.trim(),
            githubUrl: document.getElementById('bioGithub').value.trim(),
          };
          currentBio = { ...currentBio, ...updated };
          localStorage.setItem('devault_custom_bio', JSON.stringify(currentBio));
          if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', bio: currentBio });
          
          const status = document.getElementById('saveStatus');
          status.innerText = '✓ Bio updated and synced live to portfolio!';
          setTimeout(() => { if (status) status.innerText = ''; }, 3000);
        };

        document.getElementById('resetBioBtn').onclick = () => {
          if (confirm('Reset portfolio information back to default values?')) {
            localStorage.removeItem('devault_custom_bio');
            currentBio = { ...DEFAULT_BIO };
            if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', bio: currentBio });
            render();
          }
        };
      }

      if (activeTab === 'inbox') {
        const expBtn = document.getElementById('exportBtn');
        if (expBtn) {
          expBtn.onclick = () => {
            const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(messages, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute('href', dataStr);
            dl.setAttribute('download', `yahia-elsemary-inbox-export-${Date.now()}.json`);
            dl.click();
          };
        }
        const clrBtn = document.getElementById('clearBtn');
        if (clrBtn) {
          clrBtn.onclick = () => {
            if (confirm('Clear all messages?')) {
              localStorage.removeItem('devault-secure-inbox');
              loadState();
              render();
            }
          };
        }
      }

      if (activeTab === 'broadcast') {
        document.getElementById('saveBroadcastBtn').onclick = () => {
          const val = document.getElementById('broadcastInput').value.trim();
          localStorage.setItem('devault_public_notice', val);
          if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', notice: val });
          alert('Broadcast Notice Pushed Live to Public Portfolio!');
        };
        document.getElementById('clearBroadcastBtn').onclick = () => {
          localStorage.removeItem('devault_public_notice');
          if (syncChannel) syncChannel.postMessage({ type: 'SYNC_ALL', notice: '' });
          document.getElementById('broadcastInput').value = '';
          alert('Broadcast Notice Disabled.');
        };
      }
    }

    window.deleteMsg = (id) => {
      messages = messages.filter(m => m.id !== id);
      localStorage.setItem('devault-secure-inbox', JSON.stringify(messages));
      render();
    };

    window.addEventListener('storage', (e) => {
      if ((e.key === 'devault-secure-inbox' || e.key === 'devault_custom_bio') && isAuthenticated) {
        loadState();
        render();
      }
    });

    render();
  </script>
</body>
</html>
