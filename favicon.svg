<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian cyber gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Subtle cyber border glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.5)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.15)" />
    </linearGradient>

    <!-- Futuristic White-Silver Glow for Y -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Sleek Container with chamfered cyber styling -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle internal tech grid lines -->
  <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Modern Geometric Architectural 'Y' -->
  <g filter="url(#subtleGlow)">
    <!-- Left upper arm -->
    <path d="M30 28 L45 28 L60 56 L51 68 Z" fill="url(#letterGrad)" />
    <!-- Right upper arm -->
    <path d="M90 28 L75 28 L51 68 L60 80 Z" fill="url(#letterGrad)" />
    <!-- Lower vertical stem -->
    <path d="M53 72 L67 72 L67 92 L53 92 Z" rx="2" fill="url(#letterGrad)" />
    <!-- Center focal cyber diamond accent -->
    <polygon points="60,54 66,62 60,70 54,62" fill="#38bdf8" />
  </g>

  <!-- Corner accent marks -->
  <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.4)" />
  <circle cx="100" cy="100" r="1.5" fill="#38bdf8" />
</svg>
